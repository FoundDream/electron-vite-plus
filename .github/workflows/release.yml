name: Release Alpha

on:
  push:
    tags:
      - "v*-alpha.*"
  workflow_dispatch:
    inputs:
      operation:
        description: Release maintenance operation
        required: true
        type: choice
        options:
          - reconcile-dist-tags

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.11.0
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:all
      - run: npm run verify:release
      - run: npm pack --dry-run --json
      - run: npm pack --workspace=create-electron-vite-plus --dry-run --json

  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.11.0
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build:all
      - run: npm run verify:release
      - run: node scripts/publish-packages.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  maintenance:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'reconcile-dist-tags'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.11.0
          registry-url: https://registry.npmjs.org

      - run: node scripts/publish-packages.mjs
        env:
          EVP_RECONCILE_ONLY: "1"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
