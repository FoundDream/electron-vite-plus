name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20.19.0
            package_build: false
          - os: ubuntu-latest
            node: 22.18.0
            package_build: true
          - os: macos-latest
            node: 24.11.0
            package_build: true
          - os: windows-latest
            node: 24.11.0
            package_build: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test

      # Vite+ pack currently uses Promise.withResolvers, which is unavailable in Node 20.
      - name: Build packages
        if: matrix.package_build
        run: npm run build:all

      - name: Smoke test packaged CLI
        if: matrix.package_build
        run: npm run smoke:build

      - name: Validate packaged CLI configuration
        if: matrix.package_build
        run: npm run smoke:doctor

      - name: Inspect core package
        if: matrix.package_build
        run: npm pack --dry-run --json

      - name: Inspect project creator package
        if: matrix.package_build
        run: npm pack --workspace=create-electron-vite-plus --dry-run --json

      - name: Electron runtime smoke test
        if: runner.os == 'macOS'
        run: npm run smoke:runtime
