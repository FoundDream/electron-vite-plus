name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20.19.0
          - os: ubuntu-latest
            node: 22.18.0
          - os: macos-latest
            node: 24.11.0
          - os: windows-latest
            node: 24.11.0

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:all
      - run: npm run smoke:build
      - run: npm pack --dry-run --json
      - run: npm pack --workspace=create-electron-vite-plus --dry-run --json

      - name: Electron runtime smoke test
        if: runner.os == 'macOS'
        run: npm run smoke:runtime
